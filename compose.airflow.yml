x-airflow-common: &airflow-common
  image: retailpulse-airflow:3.3.1
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow-local-only@airflow-db:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-retailpulse-airflow-local-jwt-key-change-for-shared-host}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET:-retailpulse-airflow-local-api-key}
    AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_HOST_PORT:-18082}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: '15'
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: '15'
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-retail-airflow-local-only}
    OLTP_HOST: oltp-db
    OLTP_PORT: '5432'
    OLTP_DB: retail_app_db
    DWH_HOST: dwh-db
    DWH_PORT: '5432'
    DWH_DB: retail_dwh_db
    APP_HOST: app
    APP_PORT: '8000'
    LAKE_BACKEND: s3
    LAKE_ENDPOINT_URL: http://minio:9000
    LAKE_ACCESS_KEY: ${LAKE_ACCESS_KEY:-retailpulse}
    LAKE_SECRET_KEY: ${LAKE_SECRET_KEY:-retailpulse-local-only}
    LAKE_BUCKET: ${LAKE_BUCKET:-retailpulse-raw}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags:ro
    - ./src:/workspace/src:ro
    - ./config:/workspace/config:ro
    - ./scripts:/workspace/scripts:ro
    - ./sql:/workspace/sql:ro
    - ./bi:/workspace/bi:ro
    - ./tests:/workspace/tests:ro
    - ./infra/airflow:/workspace/infra/airflow:ro
    - ./data_lake:/workspace/data_lake
    - ./models:/workspace/models
    - airflow_logs:/opt/airflow/logs
    - airflow_auth:/opt/airflow/auth
  networks:
    - retail-network
  depends_on: &airflow-dependencies
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
    minio:
      condition: service_healthy
    dwh-db:
      condition: service_healthy
    oltp-db:
      condition: service_healthy
    app:
      condition: service_started

services:
  airflow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow-local-only
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - retail-network

  airflow-init:
    <<: *airflow-common
    restart: 'no'
    command: [python, /workspace/infra/airflow/init.py]
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: [api-server]
    ports:
      - '127.0.0.1:${AIRFLOW_HOST_PORT:-18082}:8080'
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler
    command: [scheduler]
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  airflow-dag-processor:
    <<: *airflow-common
    command: [dag-processor]
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 45s

volumes:
  airflow_metadata:
  airflow_logs:
  airflow_auth:
